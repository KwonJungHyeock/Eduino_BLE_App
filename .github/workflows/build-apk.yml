# Author: eduino
# 로컬 Flutter 설치 없이 GitHub 에서 안드로이드 디버그 APK 를 빌드한다.
# platform 폴더(android/)는 저장소에 없으므로 CI 에서 flutter create 로 생성 후 권한 주입.

name: Build APK

on:
  push:
    branches:
      - claude/new-session-jnm6sg
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Release 발행(APK 자산 업로드)용
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name eduino_rc --org kr.eduino

      - name: Inject BLE permissions into AndroidManifest
        run: python3 tool/inject_manifest.py

      - name: Pub get
        run: flutter pub get

      - name: Analyze (non-blocking, for logs)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: eduino-rc-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      # QR/직접 다운로드용 — 로그인 없이 받을 수 있는 공개 Release 자산으로 발행.
      # 고정 태그(apk-latest)에 매 빌드마다 APK 를 덮어써 최신 링크를 유지.
      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: EDUINO RC 최신 APK
          body: |
            EDUINO RC 컨트롤러 자동 빌드 디버그 APK.
            폰/태블릿에서 아래 `app-debug.apk` 를 받아 설치하세요 (출처 알 수 없는 앱 허용 필요).
          files: build/app/outputs/flutter-apk/app-debug.apk
          make_latest: "true"
