# Author: eduino
# 스토어 배포용 릴리스 빌드 — 수동 트리거(workflow_dispatch).
#   Android: AAB(--release) + 업로드 키스토어 서명(secret) + 난독화 심볼. targetSdk 35.
#   iOS: 릴리스 컴파일 검증(--no-codesign). 서명 ipa 는 Apple 인증서 필요(문서 RELEASE.md 참조).
# platform 폴더(android/·ios/)는 저장소에 없으므로 CI 에서 flutter create 로 생성 후 패치.
#
# 필요한 GitHub Secrets(Android 서명 · 없으면 debug 서명으로 폴백해 빌드만 검증):
#   ANDROID_KEYSTORE_BASE64   업로드 키스토어(.jks)를 base64 로 인코딩한 값
#   ANDROID_KEYSTORE_PASSWORD 스토어 비밀번호
#   ANDROID_KEY_ALIAS         키 별칭
#   ANDROID_KEY_PASSWORD      키 비밀번호

name: Build Release

on:
  workflow_dispatch:

jobs:
  android-aab:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 서명 APK 를 공개 Release(release-latest)로 발행
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.0
          cache: true
      - run: flutter --version

      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name eduino_rc --org kr.eduino

      - name: Inject BLE/mic permissions
        run: python3 tool/inject_manifest.py

      - name: Pub get
        run: flutter pub get

      - name: Patch HC-06 SPP plugin (AGP 8 namespace)
        run: python3 tool/patch_spp_plugin.py

      - name: Patch gradle for release (SDK 35 + signing)
        run: python3 tool/patch_release_gradle.py

      - name: Show patched build.gradle.kts (debug)
        run: sed -n '1,80p' android/app/build.gradle.kts || true

      - name: Decode upload keystore + key.properties (if secrets present)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/upload-keystore.jks
            {
              echo "storePassword=$KS_PW"
              echo "keyPassword=$KEY_PW"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "release signing configured"
          else
            echo "no keystore secret — debug 서명으로 폴백(빌드 검증만)"
          fi

      - name: Generate launcher icons / splash
        run: |
          dart run flutter_launcher_icons || true
          dart run flutter_native_splash:create || true

      - name: Build AAB (release, obfuscated)
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols

      - name: Build APK (release, signed) — 실기기 설치용 + 매니페스트 검증용
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      - name: Verify signature / manifest / targetSdk / minify
        run: |
          set +e
          AAB=build/app/outputs/bundle/release/app-release.aab
          APK=build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -1)
          echo "### build-tools: $BT"
          echo "===== [AAB] 서명 인증서 지문(jarsigner v1) ====="
          keytool -printcert -jarfile "$AAB" | grep -Ei "SHA1|SHA256" | sed 's/^/AAB /'
          echo "===== [APK] 서명 인증서 지문(apksigner) ====="
          "$BT/apksigner" verify --print-certs "$APK" | grep -Ei "digest"
          echo "===== [APK] package / targetSdk ====="
          "$BT/aapt" dump badging "$APK" | grep -Ei "^package:|targetSdkVersion|sdkVersion"
          echo "===== [APK] permissions ====="
          "$BT/aapt" dump permissions "$APK"
          echo "===== INTERNET 존재 여부(없어야 정상) ====="
          "$BT/aapt" dump permissions "$APK" | grep -i INTERNET && echo "!! INTERNET FOUND" || echo "INTERNET: none (OK)"
          echo "===== minify(R8) 적용 여부 — mapping.txt 존재 확인 ====="
          ls -la build/app/outputs/mapping/release/mapping.txt 2>/dev/null && echo "minify: ON (mapping present)" || echo "minify: mapping.txt 없음"
          exit 0

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: eduino-rc-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eduino-rc-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # QR/직접 설치용 — 로그인 없이 받을 수 있는 공개 Release 자산(고정 태그).
      # 업로드 키로 서명된 release APK 를 release-latest 에 덮어써 최신 링크 유지.
      - name: Publish signed APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-latest
          name: EDUINO 서명 릴리스 APK (최신)
          body: |
            업로드 키로 서명된 release APK (minify/proguard, targetSdk 35, 오프라인).
            아래 app-release.apk 를 받아 설치하세요 (출처 알 수 없는 앱 허용 필요).
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: "false"

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: eduino-rc-symbols
          path: build/symbols
          if-no-files-found: warn

  ios-validate:
    runs-on: macos-latest
    # iOS 검증은 수동 실행에서만(매 push 마다 macOS 러너 소모 방지).
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.0
          cache: true
      - run: flutter --version

      - name: Generate iOS platform files
        run: flutter create . --platforms=ios --project-name eduino_rc --org kr.eduino

      - name: Inject iOS usage descriptions (BLE/mic/speech)
        run: python3 tool/inject_ios_plist.py

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (release, no codesign — 검증)
        run: flutter build ios --release --no-codesign
