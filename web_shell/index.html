<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EDUINO · 스마트폰 미리보기</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Roboto,sans-serif;
    background:
      radial-gradient(circle at 18% 15%, #E9F1FC, transparent 55%),
      radial-gradient(circle at 85% 88%, #FDEDEF, transparent 50%),
      #EDF2F8;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100%; overflow:hidden;
  }
  .bar{position:fixed; top:0; left:0; right:0; height:54px; z-index:10;
       display:flex; align-items:center; gap:14px; padding:0 18px;}
  .brand{font-weight:800; color:#15202E; font-size:16px; letter-spacing:-.2px}
  .brand span{color:#EE4C57}
  .seg{display:flex; gap:4px; background:#fff; border:1px solid #E2E9F2; border-radius:999px; padding:4px; box-shadow:0 4px 14px rgba(27,58,107,.07)}
  .seg button{border:0; background:transparent; font:inherit; font-size:12.5px; font-weight:700; color:#6B7684; padding:6px 13px; border-radius:999px; cursor:pointer; transition:.15s}
  .seg button.on{background:#1C7DF3; color:#fff}
  .reload{margin-left:auto; border:1px solid #E2E9F2; background:#fff; color:#6B7684; font:inherit; font-weight:700; font-size:12.5px; padding:7px 14px; border-radius:999px; cursor:pointer; box-shadow:0 4px 14px rgba(27,58,107,.07)}

  .stage{display:flex; align-items:center; justify-content:center; flex:1; width:100%; transform-origin:center center}
  .phone{position:relative; background:#0E1726; border-radius:48px; padding:14px;
         box-shadow:0 34px 80px rgba(15,30,55,.38), inset 0 0 0 2px #26334A;}
  /* 전면 카메라(펀치홀) */
  .phone::before{content:""; position:absolute; top:26px; left:50%; transform:translateX(-50%);
                 width:9px; height:9px; border-radius:50%; background:#060a12;
                 box-shadow:inset 0 0 0 2px #1b2536; z-index:4;}

  .screen{position:relative; border-radius:36px; overflow:hidden; background:#F3F7FC;
          display:flex; flex-direction:column;}

  /* 상단 상태바(카메라 영역 확보) */
  .statusbar{flex:0 0 auto; height:34px; display:flex; align-items:center; justify-content:space-between;
             padding:0 22px; font-size:12px; font-weight:700; color:#15202E; background:#F3F7FC;}
  .statusbar .r{display:flex; align-items:center; gap:6px; color:#3a4757}
  .statusbar svg{display:block}

  iframe{flex:1 1 auto; border:0; display:block; width:100%; background:#F3F7FC}

  /* 하단 내비게이션 바(안드로이드식) — 뒤로/홈/최근 */
  .navbar{flex:0 0 auto; height:48px; display:flex; align-items:center; justify-content:space-around;
          background:#EDF1F6; border-top:1px solid #E1E7EF;}
  .navbar button{border:0; background:transparent; padding:8px 22px; cursor:pointer; border-radius:12px; color:#41505f;}
  .navbar button:active{background:#DDE5EE}
  .navbar svg{display:block}

  .caption{position:fixed; bottom:14px; left:0; right:0; text-align:center; color:#6B7684; font-size:12.5px; padding:0 16px}

  @media (max-width:680px){
    .bar,.caption{display:none}
    body{overflow:auto}
    .phone{padding:0; border-radius:0; box-shadow:none}
    .phone::before{display:none}
    .screen{border-radius:0; width:100vw!important; height:100vh!important}
    .statusbar,.navbar{display:none} /* 실제 폰은 자체 상태바·내비 사용 */
    .stage{transform:none!important}
  }
</style>
</head>
<body>
  <div class="bar">
    <div class="brand">Eduino<span> AI</span> · 미리보기</div>
    <div class="seg" id="seg">
      <button data-w="390" data-h="844" class="on">폰</button>
      <button data-w="430" data-h="932">큰 폰</button>
      <button data-w="834" data-h="1112">태블릿</button>
    </div>
    <button class="reload" id="reload">↻ 처음부터</button>
  </div>

  <div class="stage" id="stage">
    <div class="phone" id="phone">
      <div class="screen" id="screen">
        <div class="statusbar">
          <span id="clock">9:41</span>
          <span class="r">
            <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
            <svg width="22" height="12" viewBox="0 0 22 12" fill="none"><rect x="1" y="1" width="18" height="10" rx="2.5" stroke="currentColor" stroke-width="1.2"/><rect x="3" y="3" width="12" height="6" rx="1" fill="currentColor"/><rect x="20" y="4" width="1.6" height="4" rx=".8" fill="currentColor"/></svg>
          </span>
        </div>

        <iframe id="frame" src="app/" title="EDUINO app"
          allow="accelerometer; gyroscope; magnetometer; microphone"></iframe>

        <div class="navbar">
          <button id="navBack" title="뒤로가기" aria-label="뒤로가기">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 4l-8 8 8 8z"/></svg>
          </button>
          <button id="navHome" title="홈" aria-label="홈">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
          </button>
          <button id="navRecent" title="처음부터" aria-label="처음부터">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="caption">실제 스마트폰 규격 · 상단 카메라/하단 내비 영역 반영 · ◁ 로 앱 뒤로가기 (블루투스 연결만 웹에서 미동작)</div>

  <script>
    var W = 390, H = 844;
    var screenEl = document.getElementById('screen');
    var stage = document.getElementById('stage');
    var frame = document.getElementById('frame');

    function apply() {
      var small = window.matchMedia('(max-width:680px)').matches;
      if (small) { stage.style.transform = 'none'; return; }
      screenEl.style.width = W + 'px';
      screenEl.style.height = H + 'px';
      var avail = window.innerHeight - 120;
      var frameH = H + 28;
      var s = Math.min(1, avail / frameH);
      stage.style.transform = 'scale(' + s + ')';
    }

    document.getElementById('seg').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      Array.prototype.forEach.call(this.children, function (c) { c.classList.remove('on'); });
      b.classList.add('on');
      W = +b.dataset.w; H = +b.dataset.h; apply();
    });

    // 폰 내비게이션 — iframe 은 동일 출처(/app)라 history 접근 가능.
    document.getElementById('navBack').addEventListener('click', function () {
      try { frame.contentWindow.history.back(); } catch (e) { frame.src = 'app/'; }
    });
    document.getElementById('navHome').addEventListener('click', function () {
      try { frame.contentWindow.location.hash = '#/home'; } catch (e) { frame.src = 'app/#/home'; }
    });
    document.getElementById('navRecent').addEventListener('click', function () { frame.src = 'app/'; });
    document.getElementById('reload').addEventListener('click', function () { frame.src = 'app/'; });

    window.addEventListener('resize', apply);
    apply();
  </script>
</body>
</html>
